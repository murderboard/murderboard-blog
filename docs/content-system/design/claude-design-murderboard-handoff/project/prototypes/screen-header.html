<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Episode One — Murder Board</title>
<link rel="stylesheet" href="tokens.css">
<style>
body{margin:0}
.hero{
  position:relative;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;overflow:hidden;background:radial-gradient(ellipse at 50% 30%, #241c14, var(--black) 70%);
}
.hero-content{position:relative;z-index:2;max-width:60ch;padding:0 1.5rem;opacity:0;transform:translateY(18px);animation:fade-up 1.1s ease .2s forwards}
.hero .eyebrow{display:block;margin-bottom:1.2rem}
.hero h1{font-size:clamp(2.6rem,8vw,5.5rem);line-height:1.02;margin:0 0 .5rem}
.hero h1 em{color:var(--red);font-style:italic}
.hero .atmo{font-family:var(--font-read);font-size:1.2rem;color:var(--cream-dim);max-width:44ch;margin:1.2rem auto 0}
.continue{
  margin-top:2.6rem;display:inline-flex;align-items:center;gap:.6em;
  font-family:var(--font-body);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--cream-dim);cursor:pointer;background:none;border:none;
  opacity:0;animation:fade-up 1.1s ease 1.1s forwards;
}
.continue:hover{color:var(--red)}
.continue .arrow{display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}
@keyframes fade-up{to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){
  .hero-content,.continue{animation:none;opacity:1;transform:none}
  .continue .arrow{animation:none}
}
.back{position:fixed;top:1.2rem;left:1.2rem;z-index:5;color:var(--cream-dim);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;text-decoration:none}
.back:hover{color:var(--red)}
</style>
</head>
<body>
<svg class="grain" width="100%" height="100%">
  <filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#noise)"/>
</svg>
<a class="back" href="index.html">← Gallery</a>
<section class="hero">
  <div class="vignette"></div>
  <div class="spotlight"></div>
  <div class="blinds"></div>
  <div class="hero-content">
    <span class="eyebrow">A Murder Board Serial — Episode One</span>
    <h1>The Rittenhouse<br><em>Dog Walker</em></h1>
    <p class="atmo">Six months of the same route, the same fountain, the same hour. Someone was paying closer attention than the cameras were.</p>
  </div>
  <button class="continue" onclick="document.querySelector('.hero').style.transition='opacity .6s';document.querySelector('.hero').style.opacity=0;setTimeout(()=>location.href='screen-scroll.html',550)">Begin Reading <span class="arrow">↓</span></button>
</section>
</body>
</html>
