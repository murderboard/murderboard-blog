<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Murder Board — Episode 6</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  /*
    ============================================================
    DATA BLOCK is at the bottom of the <script> section.
    To update this board for a new episode: edit BOARD.episodeTag,
    BOARD.title, BOARD.subhead, BOARD.cards, and BOARD.strings only.
    Everything above that in this file (styles, layout engine,
    pan/zoom, lightbox) is the reusable template and matches the
    Murder Board brand system -- it shouldn't need to change between episodes.
    ============================================================
  */
  * { box-sizing: border-box; }
  :root {
    --black: #0d0b0b;
    --dark: #161212;
    --dark2: #1c1818;
    --red: #ed1c2e;
    --red-dark: #b8101f;
    --pink: #ff3d8b;
    --yellow: #ffd83d;
    --navy: #1a1f3a;
    --cream: #f0ece0;
    --cream-dim: #c8c3b2;
    --cork: #7a5c10;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--black);
    font-family: 'Special Elite', monospace;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.35; mix-blend-mode: overlay;
  }
  #viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #board-surface {
    position: absolute; top: 0; left: 0;
    background:
      repeating-linear-gradient(0deg, rgba(110,82,22,0.05) 0px, rgba(110,82,22,0.05) 1px, transparent 1px, transparent 30px),
      repeating-linear-gradient(90deg, rgba(110,82,22,0.04) 0px, rgba(110,82,22,0.04) 1px, transparent 1px, transparent 30px),
      linear-gradient(135deg, #1e1610, #161210, #1a1510);
    border: 3px solid rgba(100,75,20,0.35);
  }
  #board-surface::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cellipse cx='25' cy='20' rx='18' ry='10' fill='rgba(130,95,20,0.06)' transform='rotate(25 25 20)'/%3E%3Cellipse cx='80' cy='70' rx='14' ry='22' fill='rgba(130,95,20,0.04)' transform='rotate(-10 80 70)'/%3E%3Cellipse cx='50' cy='95' rx='22' ry='8' fill='rgba(130,95,20,0.05)' transform='rotate(15 50 95)'/%3E%3C/svg%3E");
  }
  .string-layer { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .annotation {
    position: absolute; font-family: 'Special Elite', monospace; font-size: 11px;
    color: var(--cream-dim); opacity: 0.45; letter-spacing: 0.1em; text-transform: uppercase;
    pointer-events: none;
  }
  .card { position: absolute; cursor: pointer; transition: filter 0.15s ease; user-select: none; }
  .card:hover { filter: brightness(1.12); z-index: 50; }
  .pin {
    position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 13px; height: 13px; border-radius: 50%; background: var(--red);
    box-shadow: 0 2px 8px rgba(0,0,0,0.6); z-index: 10;
  }
  .pin::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 5px; height: 5px; background: rgba(255,200,200,0.45); border-radius: 50%;
  }
  .pin.gold { background: #c8942a; }
  .pin.white { background: #e8e4d8; }
  .card-polaroid { background: var(--cream); padding: 9px 9px 26px; box-shadow: 3px 6px 22px rgba(0,0,0,0.75); }
  .card-polaroid .img {
    background: #1c1515; aspect-ratio: 4/5; display: flex; align-items: center; justify-content: center;
    font-family: monospace; font-size: 10px; color: #4a3838; text-align: center; padding: 6px; line-height: 1.5;
  }
  .card-polaroid .cap {
    text-align: center; font-family: 'Special Elite', monospace; font-size: 10px; color: #2a2020;
    padding-top: 8px; letter-spacing: 0.06em; text-transform: uppercase;
  }
  .card-postit { padding: 13px 15px; font-family: 'Special Elite', monospace; font-size: 13px; line-height: 1.55; box-shadow: 3px 5px 16px rgba(0,0,0,0.6); }
  .card-postit.y { background: #f5e642; color: #1a1400; }
  .card-postit.r { background: #e83232; color: #fceaea; }
  .card-postit.w { background: var(--cream); color: #1a1a1a; }
  .card-postit.pink { background: #f5a0c0; color: #2a0014; }
  .card-typed {
    background: var(--cream); color: #111; padding: 14px 16px; font-family: 'Special Elite', monospace;
    font-size: 13px; line-height: 1.65; box-shadow: 3px 5px 16px rgba(0,0,0,0.6); border-top: 3px solid var(--red);
  }
  .card-typed .hdr {
    font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--red);
    margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(192,0,26,0.25);
  }
  .card-id { background: var(--cream); color: #111; padding: 12px 14px; box-shadow: 3px 5px 16px rgba(0,0,0,0.6); font-family: 'Special Elite', monospace; border-left: 4px solid var(--red); }
  .card-id .role { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--red); margin-bottom: 4px; }
  .card-id .name { font-size: 15px; font-weight: bold; color: var(--black); margin-bottom: 3px; }
  .card-id .detail { font-size: 11px; color: #555; line-height: 1.55; }
  .card-clipping { background: #e8e0cc; padding: 13px 15px; font-family: 'Special Elite', monospace; box-shadow: 3px 5px 16px rgba(0,0,0,0.6); }
  .card-clipping .headline { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: #111; line-height: 1.25; margin-bottom: 6px; border-bottom: 2px solid #111; padding-bottom: 5px; }
  .card-clipping .body { font-size: 10.5px; color: #333; line-height: 1.6; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 20px 24px; pointer-events: none; z-index: 200; }
  #title-block { max-width: 420px; }
  .board-episode-tag { display: inline-flex; align-items: center; gap: 0.7rem; background: rgba(192,0,26,0.16); border: 1px solid rgba(192,0,26,0.35); padding: 0.4rem 0.9rem; margin-bottom: 0.7rem; }
  .board-episode-tag span { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; }
  .tag-label { color: var(--red); }
  .tag-ep { color: var(--cream-dim); }
  #title-text { font-family: 'Playfair Display', serif; font-weight: 900; font-size: 26px; text-transform: uppercase; color: var(--cream); margin: 0 0 6px; line-height: 1.1; }
  #subhead { font-size: 12px; color: var(--cream-dim); line-height: 1.6; }
  #hint { display: none; }
  #legend { position: fixed; bottom: 22px; left: 24px; z-index: 200; display: flex; flex-wrap: wrap; gap: 14px; pointer-events: none; background: rgba(13,11,11,0.55); padding: 8px 14px; border: 1px solid rgba(240,236,224,0.1); }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.1em; color: var(--cream-dim); text-transform: uppercase; }
  .legend-dot { width: 9px; height: 9px; border-radius: 50%; }
  #controls { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: auto; }
  #controls button {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(192,0,26,0.4);
    background: rgba(13,11,11,0.75); color: var(--cream); font-size: 16px; font-family: 'Special Elite', monospace;
    cursor: pointer;
  }
  #controls button:hover { background: var(--red); border-color: var(--red); }
  #lightbox { position: fixed; inset: 0; background: rgba(13,11,11,0.85); display: none; align-items: center; justify-content: center; z-index: 500; padding: 32px; cursor: pointer; }
  #lightbox.open { display: flex; }
  #lightbox-card { max-width: 380px; cursor: default; }
  #lightbox-detail {
    background: var(--cream); margin-top: 14px; padding: 16px 18px; border-top: 3px solid var(--red);
    font-family: 'Special Elite', monospace; font-size: 13px; line-height: 1.65; color: #1a1a1a;
    max-width: 380px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  }
  #lightbox-detail:empty { display: none; }
  #lightbox-detail .hdr { font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase; color: var(--red); margin-bottom: 8px; display: block; }
</style>
</head>

<script>
const WORLD_W = 2400;
const WORLD_H = 1500;

/* ============================================================
   EPISODE 6 DATA — edit only this block to update the board.
   Cards: polaroid | postit (y/r/w/pink) | typed | id | clipping
   Strings: kind = confirmed | suspected | evidence | unverified
   ============================================================ */
const BOARD = {
  tagEp: "Episode 6 — The Apartment",
  title: "The Missing Manuscript",
  subhead: "Two documented claims on Della's work. One anonymous threat. One syringe that doesn't belong.",

  cards: [

    /* --- VICTIM --- */
    { id:'halloway', type:'polaroid', x:70, y:320, w:165, rotate:-2.5,
      caption: 'PROF. JAMES HALLOWAY — VICTIM',
      detail: "Rittenhouse Conservatory — pianist and jazz scholar. Bought Della Mercer's manuscript at an estate sale, had it authenticated, was writing a book. Found dead Friday morning (~9–9:30) by Marcus. Officially ruled a suicide; police call it 'not suspicious' and closed the case. Marcus — who knew him — says he was scared Thursday night, after the theft. Not upset about the theft. Scared."
    },

    /* --- TIMELINE --- */
    { id:'timeline', type:'typed', x:285, y:305, w:340, rotate:-1, header: 'What We Know',
      text: "WED: Diane Ashford Realty walkthrough — Diane + someone from her office.<br>THU MORNING: Someone from the office returns alone, dropping paperwork. Marcus assumed Diane.<br>THU AFTERNOON (raining): Halloway gets home, finds the manuscript gone. Calls police. Tells Lena.<br>THU NIGHT: Halloway frightened (per Marcus). Service entrance left unlatched — found 4am Fri, no log of who.<br>FRI ~9AM: Marcus finds Halloway dead. Keys missing from the apartment. A syringe on the counter.<br>FRI NIGHT: Death announced at Margaret's card game.",
      detail: "Marcus assumed the Thursday solo visitor was Diane — but he's not certain, and the note in the Ashford folder is signed 'Kelsey.' The realty return, the frightened evening, the unlatched door, the missing keys, and the syringe all sit inside a 48-hour window the police never treated as suspicious."
    },

    /* --- DELLA MERCER MANUSCRIPT (center anchor / MacGuffin) --- */
    { id:'manuscript', type:'clipping', x:875, y:300, w:390, rotate:0.5,
      headline: "THE DELLA MERCER MANUSCRIPT — MISSING",
      body: "Original composition notes, Philadelphia jazz, 1930s–1950s. Appears to prove Della authored work long credited to other artists — a catalog potentially worth millions. Bought by Halloway at an estate sale and authenticated by conservatory scholars before the theft. His draft chapters and research notes are still in the apartment. The manuscript itself: gone from the cleared center of the desk."
    },

    /* --- NAOMI MERCER (suspect, top right) --- */
    { id:'naomi', type:'id', x:1490, y:308, w:232, rotate:-2,
      role: 'Suspect — Nearest Kin',
      name: 'Naomi Mercer',
      detailLine: "Della's granddaughter. Her lawyer's letter asserts an estate claim and names an authenticator already retained.",
      flag: '? Why is an authenticator already retained before any of this is settled?',
      detail: "Formal legal approach — nearest-kin claim over Della's compositions and manuscripts. Her lawyer's letter was on Halloway's desk before he died; he received it and did not comply. No in-person appearance yet. Strong motive, real resources, doing everything correctly — which is its own kind of suspicious to Lena."
    },

    /* --- CORNERSTONE RECORDS (suspect, top right) --- */
    { id:'cornerstone', type:'id', x:1768, y:308, w:238, rotate:2,
      role: 'Suspect — Corporate IP Claim',
      name: 'Cornerstone Records',
      detailLine: "Philadelphia jazz label. Represented by Harmon & Associates LLP (New York). Demand letter on Halloway's desk before he died.",
      flag: '? Their legal claim predates the theft.',
      detail: "Claim: Della's compositions were made under contract to Cornerstone, so the label owns the IP and the manuscripts must be returned. They have the most to lose if her authorship is confirmed. A second Harmon envelope — same firm, different letter, marked urgent — arrived by courier the Monday after the death."
    },

    /* --- THREATENING NOTE (red postit, far right) --- */
    { id:'threat-note', type:'postit', color:'r', x:2055, y:308, w:207, rotate:-3,
      text: '"Della belongs to me." Handwritten on a torn conservatory newsletter, sealed in a sandwich bag. Halloway bagged it himself.',
      detail: "'Me' is singular — one person's claim, not a company's or an estate's. Possessive. Personal. It doesn't sound like Cornerstone's lawyers or Naomi's family; it sounds like someone who thinks Della is theirs. Author unknown. Written on the same newsletter that announced the manuscript in the first place — and Halloway bagged and kept it, which says he took it seriously."
    },

    /* --- ASHFORD FOLDER (yellow postit, mid-left) --- */
    { id:'ashford', type:'postit', color:'y', x:640, y:640, w:232, rotate:-2,
      text: 'Branded Diane Ashford Realty folder on the kitchen counter, listing contract inside. Already there before anyone from the building touched the apartment.',
      detail: "Marcus brought the first mail batch on this visit; the folder predates that — left during or after the walkthrough, before Halloway's death. A handwritten note is clipped to the front."
    },

    /* --- KELSEY (yellow postit, mid-right) --- */
    { id:'kelsey', type:'postit', color:'y', x:1455, y:605, w:238, rotate:2.5,
      text: '"— Kelsey" signed on the Ashford note. Same Kelsey from the phone call. Of course she dropped it off — she works there.',
      detail: "Diane's assistant; she had reason to be in the building, so Lena filed her as mundane. But her sales pitch (Ep4) described inside sensory details — including the rainy-day sound on the neighboring roof — as if she'd been in the apartment herself. Whether she was the Thursday solo visitor is the dormant question. Not a suspect on this board yet."
    },

    /* --- RAIN BOOTS (yellow postit, mid-left) --- */
    { id:'rainboots', type:'postit', color:'y', x:70, y:680, w:207, rotate:-3.5,
      text: 'Duck boots at the apartment door — dark green, slightly muddy, not moved. Thursday was the last hard rain.',
      detail: "Likely Halloway's own — stepped out of them in a hurry and never dealt with them. Either way, the mud confirms the Thursday window that everything else sits inside."
    },

    /* --- THE NEEDLE (red postit, CRITICAL) --- */
    { id:'needle', type:'postit', color:'r', x:330, y:710, w:242, rotate:1.5,
      text: 'THE SYRINGE. Marcus found it on the counter when he found Halloway. Gone by the time we visited. NOT one of his insulin pens — a loose syringe.',
      detail: "Halloway's insulin pens were in the fridge — three of them, lined up, labeled, with a cold pack. What Marcus saw on the counter wasn't one of them — it was a syringe. He went quiet at the fridge. Neither of us said the word. He showed me where he found him, too — on the kitchen floor, right by that counter; body, syringe, and pens all within a few feet. The police never looked in the fridge."
    },

    /* --- NAOMI'S LAWYER'S LETTER (typed card, desk find) --- */
    { id:'naomi-letter', type:'typed', x:1070, y:620, w:298, rotate:-1, header: "D-01 — NAOMI'S LAWYER'S LETTER",
      text: "Law firm retained by Naomi Mercer. Estate claim: nearest kin, Della's compositions and physical manuscripts. Names and gives contact for an independent authenticator already brought in to verify.<br><br>Glimpsed on the desk in Episode 1 — read in full here.",
      detail: "He received this and did not comply. The authenticator's contact is the live thread — reaching them tells us how far authentication got, who else was in contact, and whether anyone else has been asking about the manuscript."
    },

    /* --- CORNERSTONE DEMAND LETTER (typed card, desk find) --- */
    { id:'cornerstone-letter', type:'typed', x:1420, y:910, w:298, rotate:1, header: "D-05 — CORNERSTONE DEMAND LETTER",
      text: "Harmon & Associates LLP, on behalf of Cornerstone Records. Formal IP claim — Della's compositions were produced under their agreements, so any materials must be returned immediately; all rights reserved.<br><br>On Halloway's desk, there before he died.",
      detail: "A separate Harmon envelope — same firm, different letter, marked 'urgent' — was delivered by courier the Monday after the death (Lena photographed the return address in Marcus's office). Two letters, same sender, tightening."
    },

    /* --- AUTHENTICATOR LEAD (yellow postit) --- */
    { id:'authenticator', type:'postit', color:'y', x:1075, y:980, w:232, rotate:2.5,
      text: 'LEAD: The authenticator. Named in Naomi\'s letter. Contact info in hand. Who else have they spoken to?',
      detail: "Someone verified the manuscript's authenticity before it was stolen. They know what it is, what it's worth, and who has been in contact. This is the next call to make."
    },

    /* --- HALLOWAY'S FEAR (yellow postit) --- */
    { id:'fear', type:'postit', color:'y', x:340, y:950, w:232, rotate:-2.5,
      text: "Marcus: Halloway was scared Thursday night — not upset about the theft, scared. Marcus knew him well enough to tell the difference.",
      detail: "Robbed, receiving legal threats, and holding an anonymous note — he had reason to be. The police read it as distress over the theft. Marcus, who'd known the man for years, read it as fear."
    },

    /* --- OPEN Q: WHO SENT THE NOTE (pink postit) --- */
    { id:'q-note', type:'postit', color:'pink', x:2005, y:610, w:218, rotate:3,
      text: 'Who wrote "Della belongs to me"? Singular, possessive — an individual, not a company or an estate. Not the language of the two legal claims.',
      detail: ""
    },

    /* --- OPEN Q: THEO (pink postit) --- */
    { id:'q-theo', type:'postit', color:'pink', x:1745, y:605, w:218, rotate:-2,
      text: 'THEO THOMAS — Lena\'s prime suspect, pinned at center. Conservatory student, cut from the Della ensemble, eidetic musical memory, saw the original scores. Went silent the moment she messaged him. Active 2 days ago.',
      detail: "Lena reads the silence as guilt. It's more likely grief — dramatic irony she can't see yet. When shown his photo Marcus went quiet, not hostile: a recalibration, not a recognition of a killer. The thread isn't cold, but it isn't what she thinks it is."
    },

    /* --- POLICE STATUS (typed card, bottom left) --- */
    { id:'police', type:'typed', x:80, y:1150, w:338, rotate:-1, header: 'Police Status',
      text: "CASE: CLOSED. Ruled not suspicious. Theft filed separately — low priority. Cameras are display-only, nothing recorded. No one looked at the needle. No one looked in the fridge.",
      detail: "The theft gave them a tidy story: a man with a break-in and missing valuables, found dead — unfortunate, not suspicious. Marcus told them about the service door, the missing keys, and the needle. None of it landed."
    },

    /* --- MISSING KEYS (yellow postit, left) --- */
    { id:'keys', type:'postit', color:'y', x:120, y:895, w:205, rotate:-3,
      text: "Halloway's keys — gone from the apartment when Marcus found him. Marcus reported it to police. Dismissed.",
      detail: "Missing keys mean someone could have let themselves in and out. Sits alongside the unlatched service door: two separate ways in, neither one investigated."
    },

    /* --- "STEPPED ON SOME TOES" (yellow postit, right) --- */
    { id:'toes', type:'postit', color:'y', x:1775, y:980, w:225, rotate:2.5,
      text: '"Stepped on some toes with the book." Halloway said it to Marcus weeks ago, offhand, like a joke. Marcus thinks about it differently now.',
      detail: "Unconnected for now — but it's Halloway himself saying the book had made him an enemy, weeks before anyone thought there was a case to investigate."
    },

    /* --- DELLA / NEWSLETTER (clipping, bottom center) --- */
    { id:'della', type:'clipping', x:492, y:1128, w:422, rotate:0.5,
      headline: "CONSERVATORY NEWSLETTER — THE SPARK",
      body: "Halloway's announcement of a student ensemble to perform Della Mercer's recovered arrangements this spring. A public PDF — the document that set everything in motion, and the same newsletter a torn piece of which carried the handwritten threat. How Naomi and Cornerstone each learned of the find is still unknown."
    },

  ],

  annotations: [
    { x: 65, y: 290, text: 'Victim' },
    { x: 862, y: 285, text: 'The MacGuffin' },
    { x: 1474, y: 288, text: 'Suspects' },
    { x: 65, y: 1108, text: 'Background' },
  ],

  strings: [

    { from:[152, 450], to:[1065, 405], sag:60, kind:'confirmed' },
    /* Naomi wants the manuscript (suspected) */
    { from:[1606, 380], to:[1065, 405], sag:55, kind:'suspected' },
    /* Cornerstone wants the manuscript (confirmed — demand letter) */
    { from:[1880, 380], to:[1065, 405], sag:80, kind:'confirmed' },
    /* Threatening note → manuscript ("Della belongs to us") */
    { from:[2148, 375], to:[1065, 405], sag:115, kind:'suspected' },
    /* Naomi → Naomi's lawyer's letter (confirmed) */
    { from:[1606, 380], to:[1219, 750], sag:40, kind:'confirmed' },
    /* Cornerstone → Cornerstone demand letter (confirmed) */
    { from:[1880, 380], to:[1569, 1045], sag:85, kind:'confirmed' },
    /* Kelsey → Ashford folder (confirmed — her name is on the note) */
    { from:[1574, 670], to:[756, 745], sag:55, kind:'confirmed' },
    /* Needle → Halloway (physical evidence — critical) */
    { from:[451, 800], to:[152, 450], sag:60, kind:'evidence' },
    /* Naomi letter → authenticator lead (the contact info is inside) */
    { from:[1219, 815], to:[1191, 992], sag:22, kind:'confirmed' },
    /* Halloway received / bagged the threatening note (confirmed) */
    { from:[152, 450], to:[2148, 375], sag:200, kind:'confirmed' },
    /* Rain boots → Thursday timeline (unverified — could be either person) */
    { from:[172, 770], to:[455, 420], sag:80, kind:'unverified' },
    /* Cornerstone letter → threatening note (suspected same source / escalation) */
    { from:[1569, 950], to:[2148, 375], sag:80, kind:'suspected' },
    /* Missing keys → Halloway (physical evidence — access to victim) */
    { from:[222, 900], to:[152, 470], sag:45, kind:'evidence' },
  ]
};

   TEMPLATE ENGINE — do not edit below this line between episodes
   ============================================================ */

const STRING_STYLE = {
  confirmed: { stroke: '#ed1c2e', width: 2, opacity: 0.75, dash: null },
  suspected: { stroke: '#ed1c2e', width: 1.4, opacity: 0.4, dash: null },
  evidence: { stroke: '#f5e642', width: 1.4, opacity: 0.55, dash: null },
  unverified: { stroke: '#c8c3b2', width: 1.2, opacity: 0.35, dash: '5 4' }
};

function renderStrings() {
  const svg = document.getElementById('strings');
  svg.setAttribute('width', WORLD_W);
  svg.setAttribute('height', WORLD_H);
  svg.setAttribute('viewBox', `0 0 ${WORLD_W} ${WORLD_H}`);
  let html = '';
  BOARD.strings.forEach(s => {
    const st = STRING_STYLE[s.kind] || STRING_STYLE.suspected;
    const mx = (s.from[0] + s.to[0]) / 2;
    const my = (s.from[1] + s.to[1]) / 2 + s.sag;
    const dashAttr = st.dash ? `stroke-dasharray="${st.dash}"` : '';
    html += `<path d="M ${s.from[0]} ${s.from[1]} Q ${mx} ${my} ${s.to[0]} ${s.to[1]}"
      stroke="${st.stroke}" stroke-width="${st.width}" fill="none" opacity="${st.opacity}" stroke-linecap="round" ${dashAttr}/>`;
    html += `<circle cx="${s.from[0]}" cy="${s.from[1]}" r="3" fill="${st.stroke}" opacity="${st.opacity + 0.15}"/>`;
    html += `<circle cx="${s.to[0]}" cy="${s.to[1]}" r="3" fill="${st.stroke}" opacity="${st.opacity + 0.15}"/>`;
  });
  svg.innerHTML = html;
}

function renderAnnotations() {
  const layer = document.getElementById('annotation-layer');
  layer.innerHTML = (BOARD.annotations || []).map(a =>
    `<div class="annotation" style="left:${a.x}px; top:${a.y}px;">${a.text}</div>`
  ).join('');
}

function pinHTML(variant) {
  const cls = variant === 'gold' ? 'pin gold' : variant === 'white' ? 'pin white' : 'pin';
  return `<div class="${cls}"></div>`;
}

function cardInnerHTML(card) {
  if (card.type === 'polaroid') {
    return `<div class="card-polaroid"><div class="img">case photo</div><div class="cap">${card.caption}</div></div>`;
  }
  if (card.type === 'postit') {
    return `<div class="card-postit ${card.color}">${card.text}</div>`;
  }
  if (card.type === 'typed') {
    return `<div class="card-typed"><div class="hdr">${card.header}</div>${card.text}</div>`;
  }
  if (card.type === 'id') {
    return `<div class="card-id">
      <div class="role">${card.role}</div>
      <div class="name">${card.name}</div>
      <div class="detail">${card.detailLine}${card.flag ? '<br><span style="color:var(--red);">' + card.flag + '</span>' : ''}</div>
    </div>`;
  }
  if (card.type === 'clipping') {
    return `<div class="card-clipping"><div class="headline">${card.headline}</div><div class="body">${card.body}</div></div>`;
  }
  return '';
}

function pinVariantFor(card, i) {
  if (card.type === 'id') return i % 2 === 0 ? 'gold' : 'white';
  if (card.type === 'postit' && card.color === 'r') return 'default';
  return i % 4 === 0 ? 'white' : 'default';
}

function renderCards() {
  const layer = document.getElementById('card-layer');
  let html = '';
  BOARD.cards.forEach((card, i) => {
    html += `<div class="card" data-id="${card.id}" style="left:${card.x}px; top:${card.y}px; width:${card.w}px; transform: rotate(${card.rotate}deg);">
      ${pinHTML(pinVariantFor(card, i))}
      ${cardInnerHTML(card)}
    </div>`;
  });
  layer.innerHTML = html;

  layer.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      if (suppressClick) return;
      const card = BOARD.cards.find(c => c.id === el.dataset.id);
      openLightbox(card);
    });
  });
}

function openLightbox(card) {
  const lb = document.getElementById('lightbox');
  const lbCard = document.getElementById('lightbox-card');
  const lbDetail = document.getElementById('lightbox-detail');
  lbCard.innerHTML = cardInnerHTML(card);
  lbCard.style.width = (card.w * 1.6) + 'px';
  const detail = card.detail || '';
  lbDetail.innerHTML = detail ? `<span class="hdr">Detective's note</span>${detail}` : '';
  lb.classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('tag-ep-text').textContent = BOARD.tagEp;
document.getElementById('title-text').textContent = BOARD.title;
document.getElementById('subhead').textContent = BOARD.subhead;

const board = document.getElementById('board-surface');
board.style.width = WORLD_W + 'px';
board.style.height = WORLD_H + 'px';
document.getElementById('world').style.width = WORLD_W + 'px';
document.getElementById('world').style.height = WORLD_H + 'px';

renderStrings();
renderAnnotations();
renderCards();

const viewport = document.getElementById('viewport');
const world = document.getElementById('world');

let scale = 0.55, tx = 0, ty = 0;
let isDragging = false, lastX = 0, lastY = 0, moved = 0;
let suppressClick = false;

function applyTransform() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function centerView() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.min(vw / WORLD_W, vh / WORLD_H) * 0.92;
  scale = Math.max(0.25, Math.min(scale, 1));
  tx = (vw - WORLD_W * scale) / 2;
  ty = (vh - WORLD_H * scale) / 2;
  applyTransform();
}

viewport.addEventListener('mousedown', (e) => {
  isDragging = true; moved = 0;
  lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  tx += dx; ty += dy;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
  suppressClick = moved > 6;
  setTimeout(() => { suppressClick = false; }, 50);
});

viewport.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  isDragging = true; moved = 0;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
viewport.addEventListener('touchmove', (e) => {
  if (!isDragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  tx += dx; ty += dy;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  applyTransform();
}, { passive: true });
viewport.addEventListener('touchend', () => {
  isDragging = false;
  suppressClick = moved > 6;
  setTimeout(() => { suppressClick = false; }, 50);
});

function zoomAt(cx, cy, factor) {
  const newScale = Math.max(0.25, Math.min(2.5, scale * factor));
  const wx = (cx - tx) / scale, wy = (cy - ty) / scale;
  scale = newScale;
  tx = cx - wx * scale;
  ty = cy - wy * scale;
  applyTransform();
}

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => {
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 0.8);
});
document.getElementById('zoom-reset').addEventListener('click', centerView);

window.addEventListener('resize', centerView);
centerView();
</script>
