<!DOCTYPE html>

<style>
  /*
    ============================================================
    DATA BLOCK is at the bottom of the <script> section.

    Everything above that in this file (styles, layout engine,

    ============================================================
  */
  * { box-sizing: border-box; }
  :root {
    --black: #0d0b0b;
    --dark: #161212;
    --dark2: #1c1818;
    --red: #ed1c2e;
    --red-dark: #b8101f;
    --pink: #ff3d8b;
    --yellow: #ffd83d;
    --navy: #1a1f3a;
    --cream: #f0ece0;
    --cream-dim: #c8c3b2;
    --cork: #7a5c10;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: var(--black);
    font-family: 'Special Elite', monospace;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.08'/%3E%3C/svg%3E");
    pointer-events: none; z-index: 9999; opacity: 0.35; mix-blend-mode: overlay;
  }
  #viewport { position: absolute; inset: 0; overflow: hidden; cursor: grab; }
  #viewport.dragging { cursor: grabbing; }
  #world { position: absolute; top: 0; left: 0; transform-origin: 0 0; will-change: transform; }
  #board-surface {
    position: absolute; top: 0; left: 0;
    background:
      repeating-linear-gradient(0deg, rgba(110,82,22,0.05) 0px, rgba(110,82,22,0.05) 1px, transparent 1px, transparent 30px),
      repeating-linear-gradient(90deg, rgba(110,82,22,0.04) 0px, rgba(110,82,22,0.04) 1px, transparent 1px, transparent 30px),
      linear-gradient(135deg, #1e1610, #161210, #1a1510);
    border: 3px solid rgba(100,75,20,0.35);
  }
  #board-surface::before {
    content: '';
    position: absolute; inset: 0; pointer-events: none;
    background-image: url("data:image/svg+xml,%3Csvg width='120' height='120' viewBox='0 0 120 120' xmlns='http://www.w3.org/2000/svg'%3E%3Cellipse cx='25' cy='20' rx='18' ry='10' fill='rgba(130,95,20,0.06)' transform='rotate(25 25 20)'/%3E%3Cellipse cx='80' cy='70' rx='14' ry='22' fill='rgba(130,95,20,0.04)' transform='rotate(-10 80 70)'/%3E%3Cellipse cx='50' cy='95' rx='22' ry='8' fill='rgba(130,95,20,0.05)' transform='rotate(15 50 95)'/%3E%3C/svg%3E");
  }
  .string-layer { position: absolute; top: 0; left: 0; pointer-events: none; overflow: visible; }
  .annotation {
    position: absolute; font-family: 'Special Elite', monospace; font-size: 11px;
    color: var(--cream-dim); opacity: 0.45; letter-spacing: 0.1em; text-transform: uppercase;
    pointer-events: none;
  }
  .card { position: absolute; cursor: pointer; transition: filter 0.15s ease; user-select: none; }
  .card:hover { filter: brightness(1.12); z-index: 50; }
  .pin {
    position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 13px; height: 13px; border-radius: 50%; background: var(--red);
    box-shadow: 0 2px 8px rgba(0,0,0,0.6); z-index: 10;
  }
  .pin::after {
    content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 5px; height: 5px; background: rgba(255,200,200,0.45); border-radius: 50%;
  }
  .pin.gold { background: #c8942a; }
  .pin.white { background: #e8e4d8; }
  .card-polaroid { background: var(--cream); padding: 9px 9px 26px; box-shadow: 3px 6px 22px rgba(0,0,0,0.75); }
  .card-polaroid .img {
    background: #1c1515; aspect-ratio: 4/5; display: flex; align-items: center; justify-content: center;

  }
  .card-polaroid .cap {

  .card-postit { padding: 13px 15px; font-family: 'Special Elite', monospace; font-size: 13px; line-height: 1.55; box-shadow: 3px 5px 16px rgba(0,0,0,0.6); }

/* ============================================================
   TEMPLATE ENGINE — do not edit below this line between episodes
   ============================================================ */

const STRING_STYLE = {
  confirmed: { stroke: '#ed1c2e', width: 2, opacity: 0.75, dash: null },
  suspected: { stroke: '#ed1c2e', width: 1.4, opacity: 0.4, dash: null },
  evidence: { stroke: '#f5e642', width: 1.4, opacity: 0.55, dash: null },
  unverified: { stroke: '#c8c3b2', width: 1.2, opacity: 0.35, dash: '5 4' }
};

function renderStrings() {
  const svg = document.getElementById('strings');
  svg.setAttribute('width', WORLD_W);
  svg.setAttribute('height', WORLD_H);
  svg.setAttribute('viewBox', `0 0 ${WORLD_W} ${WORLD_H}`);
  let html = '';
  BOARD.strings.forEach(s => {
    const st = STRING_STYLE[s.kind] || STRING_STYLE.suspected;
    const mx = (s.from[0] + s.to[0]) / 2;
    const my = (s.from[1] + s.to[1]) / 2 + s.sag;
    const dashAttr = st.dash ? `stroke-dasharray="${st.dash}"` : '';
    html += `<path d="M ${s.from[0]} ${s.from[1]} Q ${mx} ${my} ${s.to[0]} ${s.to[1]}"
      stroke="${st.stroke}" stroke-width="${st.width}" fill="none" opacity="${st.opacity}" stroke-linecap="round" ${dashAttr}/>`;
    html += `<circle cx="${s.from[0]}" cy="${s.from[1]}" r="3" fill="${st.stroke}" opacity="${st.opacity + 0.15}"/>`;
    html += `<circle cx="${s.to[0]}" cy="${s.to[1]}" r="3" fill="${st.stroke}" opacity="${st.opacity + 0.15}"/>`;
  });
  svg.innerHTML = html;
}

function renderAnnotations() {
  const layer = document.getElementById('annotation-layer');
  layer.innerHTML = (BOARD.annotations || []).map(a =>
    `<div class="annotation" style="left:${a.x}px; top:${a.y}px;">${a.text}</div>`
  ).join('');
}

function pinHTML(variant) {
  const cls = variant === 'gold' ? 'pin gold' : variant === 'white' ? 'pin white' : 'pin';
  return `<div class="${cls}"></div>`;
}

function cardInnerHTML(card) {
  if (card.type === 'polaroid') {
    return `<div class="card-polaroid"><div class="img">case photo</div><div class="cap">${card.caption}</div></div>`;
  }
  if (card.type === 'postit') {
    return `<div class="card-postit ${card.color}">${card.text}</div>`;
  }
  if (card.type === 'typed') {
    return `<div class="card-typed"><div class="hdr">${card.header}</div>${card.text}</div>`;
  }
  if (card.type === 'id') {
    return `<div class="card-id">
      <div class="role">${card.role}</div>
      <div class="name">${card.name}</div>
      <div class="detail">${card.detailLine}${card.flag ? '<br><span style="color:var(--red);">' + card.flag + '</span>' : ''}</div>
    </div>`;
  }
  if (card.type === 'clipping') {
    return `<div class="card-clipping"><div class="headline">${card.headline}</div><div class="body">${card.body}</div></div>`;
  }
  return '';
}

function pinVariantFor(card, i) {
  if (card.type === 'id') return i % 2 === 0 ? 'gold' : 'white';
  if (card.type === 'postit' && card.color === 'r') return 'default';
  return i % 4 === 0 ? 'white' : 'default';
}

function renderCards() {
  const layer = document.getElementById('card-layer');
  let html = '';
  BOARD.cards.forEach((card, i) => {
    html += `<div class="card" data-id="${card.id}" style="left:${card.x}px; top:${card.y}px; width:${card.w}px; transform: rotate(${card.rotate}deg);">
      ${pinHTML(pinVariantFor(card, i))}
      ${cardInnerHTML(card)}
    </div>`;
  });
  layer.innerHTML = html;

  layer.querySelectorAll('.card').forEach(el => {
    el.addEventListener('click', () => {
      if (suppressClick) return;
      const card = BOARD.cards.find(c => c.id === el.dataset.id);
      openLightbox(card);
    });
  });
}

function openLightbox(card) {
  const lb = document.getElementById('lightbox');
  const lbCard = document.getElementById('lightbox-card');
  const lbDetail = document.getElementById('lightbox-detail');
  lbCard.innerHTML = cardInnerHTML(card);
  lbCard.style.width = (card.w * 1.6) + 'px';
  const detail = card.detail || '';
  lbDetail.innerHTML = detail ? `<span class="hdr">Detective's note</span>${detail}` : '';
  lb.classList.add('open');
}
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

document.getElementById('tag-ep-text').textContent = BOARD.tagEp;
document.getElementById('title-text').textContent = BOARD.title;
document.getElementById('subhead').textContent = BOARD.subhead;

const board = document.getElementById('board-surface');
board.style.width = WORLD_W + 'px';
board.style.height = WORLD_H + 'px';
document.getElementById('world').style.width = WORLD_W + 'px';
document.getElementById('world').style.height = WORLD_H + 'px';

renderStrings();
renderAnnotations();
renderCards();

const viewport = document.getElementById('viewport');
const world = document.getElementById('world');

let scale = 0.55, tx = 0, ty = 0;
let isDragging = false, lastX = 0, lastY = 0, moved = 0;
let suppressClick = false;

function applyTransform() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function centerView() {
  const vw = viewport.clientWidth, vh = viewport.clientHeight;
  scale = Math.min(vw / WORLD_W, vh / WORLD_H) * 0.92;
  scale = Math.max(0.25, Math.min(scale, 1));
  tx = (vw - WORLD_W * scale) / 2;
  ty = (vh - WORLD_H * scale) / 2;
  applyTransform();
}

viewport.addEventListener('mousedown', (e) => {
  isDragging = true; moved = 0;
  lastX = e.clientX; lastY = e.clientY;
  viewport.classList.add('dragging');
});
window.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  tx += dx; ty += dy;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', () => {
  isDragging = false;
  viewport.classList.remove('dragging');
  suppressClick = moved > 6;
  setTimeout(() => { suppressClick = false; }, 50);
});

viewport.addEventListener('touchstart', (e) => {
  if (e.touches.length !== 1) return;
  isDragging = true; moved = 0;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
}, { passive: true });
viewport.addEventListener('touchmove', (e) => {
  if (!isDragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
  moved += Math.abs(dx) + Math.abs(dy);
  tx += dx; ty += dy;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  applyTransform();
}, { passive: true });
viewport.addEventListener('touchend', () => {
  isDragging = false;
  suppressClick = moved > 6;
  setTimeout(() => { suppressClick = false; }, 50);
});

function zoomAt(cx, cy, factor) {
  const newScale = Math.max(0.25, Math.min(2.5, scale * factor));
  const wx = (cx - tx) / scale, wy = (cy - ty) / scale;
  scale = newScale;
  tx = cx - wx * scale;
  ty = cy - wy * scale;
  applyTransform();
}

viewport.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.12 : 0.89;
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

document.getElementById('zoom-in').addEventListener('click', () => {
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25);
});
document.getElementById('zoom-out').addEventListener('click', () => {
  zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 0.8);
});
document.getElementById('zoom-reset').addEventListener('click', centerView);

window.addEventListener('resize', centerView);
centerView();
</script>

</body>
</html>
